name: release
# Cada release é um instalador do TRT8 espelhado por scripts/espelhar.sh, que
# roda numa máquina no Brasil. Aqui se confere o arquivo que o GitHub serve e
# se avisa a FlatPark, que fixa a versão nova em minutos.
on:
  release:
    types: [published]
  # Confere de novo um release já publicado, sem avisar a FlatPark.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag do release, como v2.16.0
        required: true
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Confere o asset com o SHA-256 do release e passa pelo apply_extra
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          versao=${TAG#v}
          CORPO=$(gh release view "$TAG" --json body -q .body)
          nome="pjecalc-$versao-instalador-x64.exe"
          esperado=$(printf '%s\n' "$CORPO" | sed -n 's/.*SHA-256: `\([0-9a-f]\{64\}\)`.*/\1/p')
          test -n "$esperado"
          mkdir prova
          gh release download "$TAG" -p "$nome" -O prova/pjecalc-installer.exe
          echo "$esperado  prova/pjecalc-installer.exe" | sha256sum -c -
          jre=$(sed -n 's/^ *url: \(.*jre.*\)$/\1/p' br.jus.trt8.PJeCalc.yml)
          curl -fsSL -o prova/jre.tar.gz "$jre"
          (cd prova && sh ../src/apply_extra.sh)
          test "$(cat prova/version)" = "$versao"

  # Leva o manifesto daqui para a versão do release, com um commit do
  # github-actions[bot], sem assinatura: o commit assinado exige a chave física.
  # No disparo manual não muda nada se a tag é a do manifesto, e recusa uma
  # anterior: serve para provar o job.
  manifesto:
    needs: conferir
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: manifesto
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: sudo apt-get update && sudo apt-get install -y shellcheck libarchive-tools desktop-file-utils appstream jq
      - name: Atualiza manifesto, metainfo e CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          versao=${TAG#v}
          nome="pjecalc-$versao-instalador-x64.exe"
          corpo=$(gh release view "$TAG" --json body -q .body)
          sha=$(printf '%s\n' "$corpo" | sed -n 's/.*SHA-256: `\([0-9a-f]\{64\}\)`.*/\1/p')
          data=$(printf '%s\n' "$corpo" | sed -n 's/.*Data de publicação no TRT8: \([0-9-]\{10\}\).*/\1/p')
          tamanho=$(gh release view "$TAG" --json assets -q ".assets[] | select(.name == \"$nome\") | .size")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$nome"
          ./scripts/atualizar-manifesto.sh "$versao" "$url" "$sha" "$tamanho" "$data"
      - run: ./scripts/ci.sh
      - name: Commit e push
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git diff --quiet && { echo 'nada a mudar'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: atualiza o PJe-Calc Cidadão para ${TAG#v}"
          for _ in 1 2 3; do
              git push origin HEAD:main && exit 0
              git pull --rebase origin main
          done
          exit 1

  flatpark:
    needs: conferir
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    # Sem o aviso, a FlatPark acha o release na varredura de 12 em 12 horas.
    continue-on-error: true
    permissions: {}
    steps:
      - uses: flatpark/publish-action@v1
        with:
          app-id: br.jus.trt8.PJeCalc
          tag: ${{ github.event.release.tag_name }}
